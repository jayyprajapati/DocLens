name: Publish Backend Image

# Builds the DocLens backend Docker image in CI and pushes it to the GitHub Container Registry (GHCR).
# The Hetzner server then only PULLS this image — it never compiles. Deployment (pull + restart) is
# handled by deploy-backend.yml.

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/publish-backend-image.yml'
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/doclens-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64 # the Hetzner server is amd64 (use arm64 if you switch to an Ampere/CAX box)
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
